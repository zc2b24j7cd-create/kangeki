<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>旅日誌帳</title>

  <!-- PWA（全画面表示）用の設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="旅日誌帳">
  <link rel="apple-touch-icon" href="icon.png">

  <style>
    /* 基本スタイル */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f5f4ef;
      color: #333333;
      padding: 20px;
      padding-bottom: 80px; /* 下部メニューの被り防止 */
      padding-top: env(safe-area-inset-top); /* iPhone上部のノッチ対応 */
    }

    /* ヘッダー */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid #dcdbd5;
      padding-bottom: 8px;
      margin-bottom: 15px;
    }
    .title {
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 2px;
    }
    .date {
      font-size: 12px;
      color: #888888;
    }

    /* 予算サマリー */
    .summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      text-align: center;
      margin-bottom: 20px;
    }
    .summary-label {
      font-size: 11px;
      color: #777777;
      margin-bottom: 4px;
    }
    .summary-value {
      font-size: 15px;
      font-weight: 500;
    }

    /* 投稿フォーム */
    .card {
      background: #ffffff;
      border: 1px solid #e0dfd9;
      border-radius: 4px;
      padding: 12px;
      margin-bottom: 25px;
    }
    textarea {
      width: 100%;
      height: 70px;
      border: 1px solid #dcdbd5;
      border-radius: 4px;
      padding: 8px;
      font-size: 14px;
      resize: none;
      margin-bottom: 10px;
      background: #fafaf8;
    }
    .form-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    .btn-light {
      background: #fafaf8;
      border: 1px solid #dcdbd5;
      border-radius: 4px;
      padding: 8px 12px;
      font-size: 12px;
      color: #555;
    }
    input[type="text"], input[type="datetime-local"] {
      border: 1px solid #dcdbd5;
      border-radius: 4px;
      padding: 8px;
      font-size: 12px;
      background: #fafaf8;
    }
    .input-amount { width: 100px; }
    .input-tag { flex: 1; }
    .input-date { font-size: 11px; color: #666; }

    .submit-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-submit {
      background: #1e2a38;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      padding: 10px 20px;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    /* 記録エリア */
    .empty-state {
      text-align: center;
      color: #888888;
      font-size: 13px;
      margin-top: 40px;
      line-height: 1.6;
    }

    /* 下部ナビゲーション */
    .nav-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: #f5f4ef;
      border-top: 1px solid #e0dfd9;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 11px;
      color: #777777;
      text-decoration: none;
    }
    .nav-item.active {
      color: #111111;
      font-weight: bold;
    }
    .nav-dot {
      width: 4px;
      height: 4px;
      background: #111111;
      border-radius: 50%;
      margin-bottom: 2px;
    }
  </style>
</head>
<body>

  <!-- ヘッダー -->
  <div class="header">
    <div class="title">旅日誌帳</div>
    <div class="date" id="current-date">2026/09/01</div>
  </div>

  <!-- サマリー -->
  <div class="summary-grid">
    <div>
      <div class="summary-label">基本予算</div>
      <div class="summary-value">¥30,000</div>
    </div>
    <div>
      <div class="summary-label">繰越</div>
      <div class="summary-value">¥0</div>
    </div>
    <div>
      <div class="summary-label">今月の残り</div>
      <div class="summary-value">¥30,000</div>
    </div>
  </div>

  <!-- 投稿フォーム -->
  <div class="card">
    <textarea placeholder="今日の記録を書く... #タグ もOK"></textarea>
    <div class="form-row">
      <button class="btn-light">写真</button>
      <input type="text" class="input-amount" placeholder="金額(円)">
      <input type="text" class="input-tag" placeholder="タグ 半角空白区切り">
    </div>
    <div class="submit-container">
      <input type="text" class="input-date" id="datetime-picker" value="2026/09/01 21:33">
      <button class="btn-submit">投稿する</button>
    </div>
  </div>

  <!-- コンテンツ表示部 -->
  <div class="empty-state">
    まだ記録がありません。上のフォームから最初の1件を書いてみましょう。
  </div>

  <!-- ナビゲーション -->
  <div class="nav-bar">
    <a href="#" class="nav-item active">
      <div class="nav-dot"></div>
      タイムライン
    </a>
    <a href="#" class="nav-item">予算</a>
    <a href="#" class="nav-item">1日まとめ</a>
    <a href="#" class="nav-item">設定</a>
  </div>

</body>
</html>
